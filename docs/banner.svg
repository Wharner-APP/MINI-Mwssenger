<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="MINI Messenger">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101114"/>
      <stop offset="0.55" stop-color="#181A1E"/>
      <stop offset="1" stop-color="#23262D"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8F56B"/>
      <stop offset="1" stop-color="#5BE3B0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="120" fill="#C8F56B" opacity="0.06"/>
  <circle cx="120" cy="300" r="90" fill="#5BE3B0" opacity="0.05"/>
  <g filter="url(#glow)">
    <rect x="70" y="96" width="128" height="128" rx="34" fill="none" stroke="url(#lime)" stroke-width="6"/>
    <path d="M94 190V132l24 30 24-30v58" fill="none" stroke="url(#lime)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="238" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="#E8E9EC">MINI <tspan fill="#C8F56B">Messenger</tspan></text>
  <text x="242" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#A0A6AE">Свой мессенджер. Без телефона. Без чужих серверов.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6E757F">
    <text x="242" y="246">C++20 · Qt 6 · Python 3.12 · TLS 1.3 pinning · E2E</text>
  </g>
  <rect x="70" y="248" width="120" height="4" rx="2" fill="#C8F56B" opacity="0.7"/>
</svg>
